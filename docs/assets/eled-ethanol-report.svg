<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
<title id="title">EleD ethanol descriptor report</title>
<desc id="desc">One GFN2-xTB calculation of ethanol shown as molecular, fragment charge and fragment interaction views.</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172033" flood-opacity=".12"/></filter>
  <style>
    .bg { fill:#f8fafc; }
    .panel { fill:#ffffff; stroke:#d9e1ec; }
    .title { fill:#172033; font:700 26px Inter,Arial,sans-serif; }
    .subtitle { fill:#526174; font:15px Inter,Arial,sans-serif; }
    .panel-title { fill:#172033; font:700 16px Inter,Arial,sans-serif; }
    .metric-label { fill:#66758a; font:12px Inter,Arial,sans-serif; }
    .metric-value { fill:#172033; font:700 19px Inter,Arial,sans-serif; }
    .footer { fill:#66758a; font:13px Inter,Arial,sans-serif; }
  </style>
</defs>
<rect class="bg" width="1080" height="760" rx="20"/>
<text class="title" x="42" y="48">Ethanol · GFN2-xTB · 300 K</text>
<text class="subtitle" x="42" y="76">One calculation, kept as one report, viewed at molecular and fragment levels</text>

<g filter="url(#shadow)">
  <rect class="panel" x="42" y="96" width="226" height="72" rx="12"/>
  <rect class="panel" x="284" y="96" width="226" height="72" rx="12"/>
  <rect class="panel" x="526" y="96" width="226" height="72" rx="12"/>
  <rect class="panel" x="768" y="96" width="270" height="72" rx="12"/>
  <rect class="panel" x="42" y="190" width="496" height="330" rx="14"/>
  <rect class="panel" x="562" y="190" width="476" height="150" rx="14"/>
  <rect class="panel" x="562" y="360" width="476" height="280" rx="14"/>
</g>

<text class="metric-label" x="62" y="121">total energy</text>
<text class="metric-value" x="62" y="149">−11.3886 Eh</text>
<text class="metric-label" x="304" y="121">HOMO–LUMO gap</text>
<text class="metric-value" x="304" y="149">12.6701 eV</text>
<text class="metric-label" x="546" y="121">dipole norm</text>
<text class="metric-value" x="546" y="149">1.8385 D</text>
<text class="metric-label" x="788" y="121">fragment partition</text>
<text class="metric-value" x="788" y="149">ethyl + hydroxyl</text>

<text class="panel-title" x="66" y="220">RDKit molecular map · atomic charge</text>
<image x="66" y="232" width="448" height="207" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text class="footer" x="66" y="486">Heavy-atom labels use the original RDKit atom order.</text>

<text class="panel-title" x="586" y="220">Fragment charge summary</text>
<image x="586" y="232" width="428" height="101" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>

<text class="panel-title" x="586" y="390">Fragment interaction network</text>
<image x="586" y="402" width="428" height="194" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
<text class="footer" x="586" y="621">Edge label: fragment-pair Wiberg sum.</text>

<text class="footer" x="42" y="700">Generated by EleD from one reusable XTBResult; no second engine call is needed for these views.</text>
</svg>