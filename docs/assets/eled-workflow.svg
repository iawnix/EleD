<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">EleD electronic descriptor workflow</title>
  <desc id="desc">An RDKit molecule is prepared, evaluated with the extended libxtb backend, and converted into descriptors, reports and visualizations.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#e8f2ff"/><stop offset="1" stop-color="#d7e9ff"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#f0ebff"/><stop offset="1" stop-color="#e5dcff"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#e9f8f0"/><stop offset="1" stop-color="#d8f1e4"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#fff2e5"/><stop offset="1" stop-color="#ffe4ca"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker>
  </defs>
  <rect width="1200" height="390" rx="20" fill="#fbfcfe"/>
  <text x="56" y="52" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">One RDKit molecule, several electronic views</text>
  <text x="56" y="80" font-family="Inter,Arial,sans-serif" font-size="15" fill="#526174">EleD keeps atom and bond indices attached while the same calculation feeds every descriptor layer.</text>

  <g filter="url(#shadow)">
    <rect x="56" y="135" width="210" height="150" rx="16" fill="url(#blue)" stroke="#9bc4f3"/>
    <rect x="318" y="135" width="210" height="150" rx="16" fill="url(#violet)" stroke="#b9a5ef"/>
    <rect x="580" y="105" width="230" height="210" rx="16" fill="url(#green)" stroke="#9ed6b5"/>
    <rect x="862" y="90" width="282" height="240" rx="16" fill="url(#orange)" stroke="#f0ba82"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" fill="#172033">
    <text x="161" y="174" text-anchor="middle" font-size="18" font-weight="700">RDKit molecule</text>
    <text x="161" y="204" text-anchor="middle" font-size="14">SMILES + conformer</text>
    <text x="161" y="231" text-anchor="middle" font-size="14">atoms · bonds · fragments</text>
    <text x="161" y="258" text-anchor="middle" font-size="13" fill="#526174">stable RDKit indices</text>

    <text x="423" y="174" text-anchor="middle" font-size="18" font-weight="700">EleD calculator</text>
    <text x="423" y="204" text-anchor="middle" font-size="14">one reusable result</text>
    <text x="423" y="231" text-anchor="middle" font-size="14">single point or xTB optimization</text>
    <text x="423" y="258" text-anchor="middle" font-size="13" fill="#526174">Python API + rdXTBTools</text>

    <text x="695" y="145" text-anchor="middle" font-size="18" font-weight="700">Extended libxtb</text>
    <text x="695" y="173" text-anchor="middle" font-size="14">GFN0 · GFN1 · GFN2</text>
    <text x="695" y="211" text-anchor="middle" font-size="14">energy · orbitals · charges</text>
    <text x="695" y="238" text-anchor="middle" font-size="14">overlap · basis · SCC diagnostics</text>
    <text x="695" y="275" text-anchor="middle" font-size="13" fill="#526174">the project’s native calculation layer</text>

    <text x="1003" y="127" text-anchor="middle" font-size="18" font-weight="700">Descriptor products</text>
    <text x="895" y="166" font-size="13">Molecular: energy · gap · dipole</text>
    <text x="895" y="194" font-size="13">Atomic / bond: charges · Wiberg · Mayer</text>
    <text x="895" y="222" font-size="13">Density / orbital: shell · π · frontier</text>
    <text x="895" y="250" font-size="13">Reactivity: ΔSCF · Fukui · softness</text>
    <text x="895" y="278" font-size="13">Reports / views: JSONL · CSV · SVG</text>
  </g>

  <path d="M266 210 H310" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M528 210 H572" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M810 210 H854" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="365" font-family="Inter,Arial,sans-serif" font-size="13" fill="#66758a">Calculation once · analyze many ways · export reproducibly</text>
</svg>
