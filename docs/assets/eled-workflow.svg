<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">EleD electronic descriptor workflow</title>
  <desc id="desc">An RDKit molecule is prepared, evaluated with the extended libxtb backend, and converted into molecular, atomic, bond, density, ESP, reactivity and local geometry descriptors, reports and visualizations.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#e8f2ff"/><stop offset="1" stop-color="#d7e9ff"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#f0ebff"/><stop offset="1" stop-color="#e5dcff"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#e9f8f0"/><stop offset="1" stop-color="#d8f1e4"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#fff2e5"/><stop offset="1" stop-color="#ffe4ca"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker>
  </defs>
  <rect width="1200" height="410" rx="20" fill="#fbfcfe"/>
  <text x="48" y="50" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">One RDKit molecule, several electronic views</text>
  <text x="48" y="78" font-family="Inter,Arial,sans-serif" font-size="15" fill="#526174">EleD keeps atom and bond indices attached while one calculation feeds every descriptor layer.</text>

  <g filter="url(#shadow)">
    <rect x="48" y="135" width="198" height="162" rx="16" fill="url(#blue)" stroke="#9bc4f3"/>
    <rect x="292" y="135" width="212" height="162" rx="16" fill="url(#violet)" stroke="#b9a5ef"/>
    <rect x="550" y="110" width="228" height="212" rx="16" fill="url(#green)" stroke="#9ed6b5"/>
    <rect x="824" y="96" width="328" height="240" rx="16" fill="url(#orange)" stroke="#f0ba82"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" fill="#172033">
    <text x="147" y="176" text-anchor="middle" font-size="17" font-weight="700">RDKit molecule</text>
    <text x="147" y="207" text-anchor="middle" font-size="13.5">SMILES + 3D conformer</text>
    <text x="147" y="233" text-anchor="middle" font-size="13.5">atoms · bonds · fragments</text>
    <text x="147" y="264" text-anchor="middle" font-size="12.5" fill="#526174">stable RDKit indices</text>

    <text x="398" y="176" text-anchor="middle" font-size="17" font-weight="700">EleD calculator</text>
    <text x="398" y="207" text-anchor="middle" font-size="13.5">XTBCalculator · XTBResults</text>
    <text x="398" y="233" text-anchor="middle" font-size="13.5">single point or OptimizeXTB</text>
    <text x="398" y="264" text-anchor="middle" font-size="12.5" fill="#526174">Python API + C++ rdXTBTools</text>

    <text x="664" y="150" text-anchor="middle" font-size="17" font-weight="700">Extended libxtb</text>
    <text x="664" y="178" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e4631">GFN0 · GFN1 · GFN2</text>
    <text x="664" y="212" text-anchor="middle" font-size="13.5">energy · orbitals · charges · CM5</text>
    <text x="664" y="238" text-anchor="middle" font-size="13.5">overlap · basis · ESP · SCC</text>
    <text x="664" y="284" text-anchor="middle" font-size="12.5" fill="#526174">project-built native backend</text>

    <text x="988" y="132" text-anchor="middle" font-size="17" font-weight="700">Descriptor products</text>
    <text x="846" y="166" font-size="12.5" font-weight="600">Molecular</text><text x="944" y="166" font-size="12.5">energy · gap · dipole · Properties</text>
    <text x="846" y="193" font-size="12.5" font-weight="600">Atomic / bond</text><text x="944" y="193" font-size="12.5">q · CM5 · WBO · Mayer · ESP/RESP</text>
    <text x="846" y="220" font-size="12.5" font-weight="600">Density / orb.</text><text x="944" y="220" font-size="12.5">shell · π · frontier · MCI</text>
    <text x="846" y="247" font-size="12.5" font-weight="600">Reactivity</text><text x="944" y="247" font-size="12.5">ΔSCF · Fukui · local softness</text>
    <text x="846" y="274" font-size="12.5" font-weight="600">Local geom.</text><text x="944" y="274" font-size="12.5">Sterimol · %Vbur · HOMA · ring</text>
    <text x="846" y="301" font-size="12.5" font-weight="600">Reports</text><text x="944" y="301" font-size="12.5">JSONL · CSV · SVG · HTML</text>
  </g>

  <path d="M246 216 H284" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M504 216 H542" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M778 216 H816" stroke="#718096" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="378" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13.5" fill="#66758a">Calculate once · analyze many ways · export reproducibly</text>
</svg>
