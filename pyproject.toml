[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdkit-eth"
version = "0.11.0"
description = "RDKit electronic-structure descriptors through the extended xTB C API"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2024.03",
    "numpy>=1.23,<3",
]

[project.urls]
Homepage = "https://github.com/iawnix/rdkit-eth"
Documentation = "https://github.com/iawnix/rdkit-eth/tree/main/docs"
Repository = "https://github.com/iawnix/rdkit-eth"
Issues = "https://github.com/iawnix/rdkit-eth/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
rdkit-eth = "rdkit_eth.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdkit_eth = ["protocol.json"]

[tool.setuptools.exclude-package-data]
rdkit_eth = ["*.so"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires an installed xTB engine"]
