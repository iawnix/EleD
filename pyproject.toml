[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdkit-eth"
version = "0.8.0"
description = "RDKit electronic-structure descriptors with an optional xTB backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2024.03",
    "numpy>=1.23,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
rdkit-eth = "rdkit_eth.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
rdkit_eth = ["*.so"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires an installed xTB engine"]
