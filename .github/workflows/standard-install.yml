name: standard extended-libxtb installation
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ''
          auto-activate-base: true
      - name: Build and install the complete locked profile
        run: python tools/install_native.py --jobs 2
      - name: Check installed workflows without library overrides
        run: |
          .rdkit-eth/runtime/bin/python -I examples/electronic_descriptors.py --populations
          .rdkit-eth/runtime/bin/python -I examples/rdxtb_tools.py
          .rdkit-eth/runtime/bin/python -I examples/descriptor_reports.py --output build/descriptor-example
          .rdkit-eth/runtime/bin/python -I examples/conformer_sensitivity.py --output build/conformer-example
      - name: Compare against native xTB Fukui output
        run: .rdkit-eth/runtime/bin/python -I tools/compare_fukui_cli.py --executable .rdkit-eth/runtime/bin/xtb --library .rdkit-eth/runtime/lib/libxtb.so --cases tests/data/reactivity_cases.json --output build/fukui-comparison
      - name: Verify persistent batches and expanded frozen corpus
        run: |
          .rdkit-eth/runtime/bin/python -I examples/reactivity_batch.py --output build/batch-example
          .rdkit-eth/runtime/bin/python -I examples/reactivity_batch.py --output build/batch-example
          .rdkit-eth/runtime/bin/python -I tools/validate_reactivity_dataset.py --output build/reactivity-corpus
      - name: Verify inherited runtime in an isolated venv without library overrides
        run: |
          .rdkit-eth/runtime/bin/python -m venv --system-site-packages build/inherited-runtime
          env -u XTB_LIBRARY -u XTBPATH -u XTB_PREFIX -u CONDA_PREFIX build/inherited-runtime/bin/python -I -m rdkit_eth doctor --check native --keep-overlap --json > build/inherited-native.json
          env -u XTB_LIBRARY -u XTBPATH -u XTB_PREFIX -u CONDA_PREFIX build/inherited-runtime/bin/python -I -m rdkit_eth doctor --check compiled --keep-overlap --json > build/inherited-compiled.json
      - name: Check the installed compiled wheel outside checkout
        run: |
          .rdkit-eth/runtime/bin/python tools/check_wheel.py .rdkit-eth/artifacts/build-*/compiled/*.whl --kind compiled --library "$PWD/.rdkit-eth/runtime/lib/libxtb.so" --check native --check compiled --method GFN0-xTB --keep-overlap --output .rdkit-eth/installed-wheel.json
      - uses: actions/upload-artifact@v4
        with:
          name: standard-native-0.9.1
          include-hidden-files: true
          path: |
            .rdkit-eth/installation.json
            .rdkit-eth/installed-wheel.json
            .rdkit-eth/runtime/share/xtb/rdkit-eth/
            .rdkit-eth/artifacts/
            build/fukui-comparison/
            build/reactivity-corpus/
            build/batch-example/
            build/conformer-example/
            build/inherited-*.json
