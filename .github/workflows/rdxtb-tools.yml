name: compiled rdXTBTools and locked xTB source
on:
  workflow_dispatch:
  push:
    paths: &compiled-paths
      - 'cpp/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'locks/**'
      - 'CMakeLists.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'environment*.yml'
      - '.github/workflows/**'
  pull_request:
    paths: *compiled-paths
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [release, patched]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      RDKIT_ETH_REQUIRE_RDXTB: '1'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ''
          auto-activate-base: true
      - name: Create locked RDKit SDK
        run: conda create --yes --prefix "$PWD/.rdxtb-build-env" --file locks/linux-64/rdxtb-sdk.txt
      - name: Select official runtime in its own prefix
        if: matrix.engine == 'release'
        run: |
          conda create --yes --prefix "$PWD/.runtime-env" --file locks/linux-64/runtime.txt
          echo "RDXTB_XTB_PREFIX=$PWD/.runtime-env" >> "$GITHUB_ENV"
          echo "XTB_LIBRARY=$PWD/.runtime-env/lib/libxtb.so" >> "$GITHUB_ENV"
          echo "XTBPATH=$PWD/.runtime-env/share/xtb" >> "$GITHUB_ENV"
          echo 'RDKIT_ETH_EXPECT_BASIS=0' >> "$GITHUB_ENV"
          echo 'RDKIT_ETH_EXPECT_NATIVE_GFN0=0' >> "$GITHUB_ENV"
      - name: Build and verify source with separate locked toolchain
        if: matrix.engine == 'patched'
        run: |
          conda create --yes --prefix "$PWD/.xtb-build-env" --file locks/linux-64/xtb-toolchain.txt
          conda run --no-capture-output -p "$PWD/.xtb-build-env" python tools/build_patched_xtb.py "$PWD/.xtb-rdkit" --dependency-prefix "$PWD/.xtb-build-env" --jobs 2
          echo "RDXTB_XTB_PREFIX=$PWD/.xtb-rdkit" >> "$GITHUB_ENV"
          echo "XTB_LIBRARY=$PWD/.xtb-rdkit/lib/libxtb.so" >> "$GITHUB_ENV"
          echo "XTBPATH=$PWD/.xtb-rdkit/share/xtb" >> "$GITHUB_ENV"
          echo 'RDKIT_ETH_EXPECT_BASIS=1' >> "$GITHUB_ENV"
          echo 'RDKIT_ETH_EXPECT_NATIVE_GFN0=1' >> "$GITHUB_ENV"
      - name: Install compiled adapter and locked build tools
        run: |
          RDKIT_ETH_BUILD_RDXTB=1 conda run --no-capture-output -p "$PWD/.rdxtb-build-env" python -m pip install --no-deps --no-build-isolation -e .
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" python -m pip install --no-deps --require-hashes -r locks/linux-64/release-tools-py311.txt
      - name: Verify Python interfaces
        run: |
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" python -m pytest -q
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" python examples/rdxtb_tools.py
      - name: Verify standalone C++ interface
        run: |
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" cmake -S . -B build/core -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/.rdxtb-build-env" -DRDXTB_XTB_PREFIX="$RDXTB_XTB_PREFIX" -DRDXTB_BUILD_PYTHON=OFF
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" cmake --build build/core --parallel 2
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" ctest --test-dir build/core --output-on-failure
      - name: Build both wheels from source archive
        run: conda run --no-capture-output -p "$PWD/.rdxtb-build-env" python tools/build_release.py --compiled --xtb-prefix "$RDXTB_XTB_PREFIX" --output dist/0.8.0
      - name: Verify installed compiled wheel
        run: |
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" python tools/check_wheel.py dist/0.8.0/compiled/*.whl --kind compiled --check compiled --check native --reactivity --output dist/0.8.0/installed-compiled.json
      - name: Verify installed native population descriptors
        if: matrix.engine == 'patched'
        run: |
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" python tools/check_wheel.py dist/0.8.0/compiled/*.whl --kind compiled --check compiled --check native --keep-overlap --reactivity --output dist/0.8.0/installed-basis.json
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" python examples/electronic_descriptors.py --populations
      - name: Verify installed GFN0 capability
        if: matrix.engine == 'patched'
        run: |
          conda run --no-capture-output -p "$PWD/.rdxtb-build-env" python tools/check_wheel.py dist/0.8.0/compiled/*.whl --kind compiled --method GFN0-xTB --check compiled --check native --output dist/0.8.0/installed-gfn0.json
      - uses: actions/upload-artifact@v4
        with:
          name: local-linux-0.8.0-${{ matrix.engine }}
          include-hidden-files: true
          path: |
            dist/0.8.0/
            .xtb-rdkit/share/xtb/rdkit-eth/build.json
            .xtb-rdkit/share/xtb/rdkit-eth/ctest.log
