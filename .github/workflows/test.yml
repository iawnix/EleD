name: adapter and installed wheel
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: ''
          auto-activate-base: true
      - name: Create locked runtime
        run: conda create --yes --prefix "$PWD/.runtime-env" --file locks/linux-64/runtime.txt
      - name: Install adapter and release tools
        run: |
          conda run --no-capture-output -p "$PWD/.runtime-env" python -m pip install --no-deps --no-build-isolation -e .
          conda run --no-capture-output -p "$PWD/.runtime-env" python -m pip install --no-deps --require-hashes -r locks/linux-64/release-tools-py311.txt
      - name: Test without the optional Python backend
        run: |
          conda run --no-capture-output -p "$PWD/.runtime-env" python -m pytest -q
          conda run --no-capture-output -p "$PWD/.runtime-env" python examples/rdkit_workflow.py
          conda run --no-capture-output -p "$PWD/.runtime-env" python examples/electronic_descriptors.py
      - name: Build source archive and pure wheel
        run: conda run --no-capture-output -p "$PWD/.runtime-env" python tools/build_release.py --output dist/0.11.0
      - name: Verify optional benchmark data joins and group splits in a separate environment
        run: |
          conda run --no-capture-output -p "$PWD/.runtime-env" python -m venv --system-site-packages build/benchmark-env
          build/benchmark-env/bin/python -m pip install -r tools/benchmark-requirements.txt
          build/benchmark-env/bin/python -m pytest -q tests/test_qm8_protocol.py tests/test_qm8_geometry.py
      - name: Verify installed wheel outside checkout
        run: |
          conda run --no-capture-output -p "$PWD/.runtime-env" python tools/check_wheel.py dist/0.11.0/pure/*.whl --kind pure --check native --reactivity --output dist/0.11.0/installed-pure.json
      - uses: actions/upload-artifact@v4
        with:
          name: pure-python-0.11.0
          path: dist/0.11.0/
